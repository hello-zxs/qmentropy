<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" style="stop-color:#64b5f6;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#64b5f6;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="40" fill="url(#bg)"/>
  <!-- 发光效果 -->
  <circle cx="100" cy="90" r="70" fill="url(#glow)"/>
  <!-- 原子核 -->
  <circle cx="100" cy="90" r="12" fill="#ffd54f" stroke="#ffb300" stroke-width="2"/>
  <!-- 电子轨道 -->
  <ellipse cx="100" cy="90" rx="52" ry="20" fill="none" stroke="#90caf9" stroke-width="2.5" transform="rotate(0 100 90)"/>
  <ellipse cx="100" cy="90" rx="52" ry="20" fill="none" stroke="#4fc3f7" stroke-width="2.5" transform="rotate(60 100 90)"/>
  <ellipse cx="100" cy="90" rx="52" ry="20" fill="none" stroke="#26c6da" stroke-width="2.5" transform="rotate(120 100 90)"/>
  <!-- 电子 -->
  <circle cx="152" cy="90" r="5" fill="#4fc3f7"/>
  <circle cx="126" cy="135" r="5" fill="#26c6da"/>
  <circle cx="74" cy="45" r="5" fill="#90caf9"/>
  <!-- 底部字母 -->
  <text x="100" y="175" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#e3f2fd" text-anchor="middle">QM</text>
</svg>
