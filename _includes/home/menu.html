<div class="menu-panel" id="home-menu" tabindex="-1" hidden>
  <nav aria-label="{% if page.lang == 'zh' %}移动端菜单{% else %}Mobile menu{% endif %}">
    {%- for link in include.nav -%}
      <a href="{{ link.url | relative_url }}">{{ link.title }}</a>
    {%- endfor -%}
    <a class="menu-panel__lang" href="{{ include.alt_url | relative_url }}" hreflang="{% if page.lang == 'zh' %}en{% else %}zh-CN{% endif %}">
      {% if page.lang == 'zh' %}Read in English{% else %}阅读中文版{% endif %}
    </a>
  </nav>
</div>
