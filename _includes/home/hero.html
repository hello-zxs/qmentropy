<section class="hero">
  <div class="hero__inner">
    <p class="eyebrow rise" style="--d:.05s">{{ include.hero.eyebrow }}</p>

    <h1 class="rise" style="--d:.12s">
      {%- for line in include.hero.title_lines -%}
        {{ line }}{% unless forloop.last %}<br>{% endunless %}
      {%- endfor -%}
    </h1>

    <p class="lead rise" style="--d:.2s">{{ include.hero.lead }}</p>

    <div class="cta rise" style="--d:.28s">
      <a class="btn" href="{{ include.hero.primary_url | relative_url }}">{{ include.hero.primary_label }}</a>
      <a class="link" href="{{ include.hero.secondary_url | relative_url }}">{{ include.hero.secondary_label }} <span>›</span></a>
    </div>

    <p class="status rise" style="--d:.36s"><span class="dot" aria-hidden="true"></span>{{ include.hero.status }}</p>
  </div>
</section>
