<section class="section section--research" id="research">
  <div class="wrap reveal">
    <div class="notes__head">
      <div>
        <p class="kicker">{{ include.research.kicker }}</p>
        <h2>{{ include.research.title }}</h2>
      </div>
      <a class="link" href="{{ include.research.url | relative_url }}">{{ include.research.link_label }} <span>›</span></a>
    </div>

    <p class="section__sub">{{ include.research.sub }}</p>

    <ol class="research-index">
      {%- for tile in include.research.tiles -%}
      <li class="research-item">
        <a href="{{ tile.url | relative_url }}">
          <span class="research-item__index">0{{ forloop.index }}</span>
          <div>
            <h3>{{ tile.title }}</h3>
            <p>{{ tile.text }}</p>
          </div>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
      </li>
      {%- endfor -%}
    </ol>
  </div>
</section>
