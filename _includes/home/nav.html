<header class="nav">
  <div class="nav__inner">
    <a class="brand" href="{% if page.lang == 'zh' %}/zh/{% else %}/{% endif %}">{{ site.title }}</a>

    <nav class="nav__links" aria-label="Primary">
      {%- for link in include.nav -%}
        {%- unless link.url == '/' or link.url == '/zh/' -%}
          <a href="{{ link.url | relative_url }}">{{ link.title }}</a>
        {%- endunless -%}
      {%- endfor -%}
    </nav>

    <div class="nav__tools">
      {% if page.lang == 'zh' %}
        <a class="lang" href="{{ include.alt_url | relative_url }}" hreflang="en" lang="en" title="Read in English">EN</a>
      {% else %}
        <a class="lang" href="{{ include.alt_url | relative_url }}" hreflang="zh-CN" lang="zh-CN" title="阅读中文版">中文</a>
      {% endif %}

      <button class="icon-btn menu-toggle" type="button" aria-expanded="false" aria-controls="home-menu"
              aria-label="{% if page.lang == 'zh' %}菜单{% else %}Menu{% endif %}">
        <svg class="icon-menu" width="18" height="12" viewBox="0 0 18 12" fill="none" aria-hidden="true">
          <path d="M0 1h18M0 11h18" stroke="currentColor" stroke-width="1.5"/>
        </svg>
        <svg class="icon-close" width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>
    </div>
  </div>
</header>
