{%- comment -%}
  访问统计：只有填了 goatcounter_code 才注入脚本。
  注意 Liquid 把空字符串视为真值，必须显式比较。
{%- endcomment -%}
{% if site.goatcounter_code and site.goatcounter_code != "" %}
<script data-goatcounter="https://{{ site.goatcounter_code }}.goatcounter.com/count"
        async src="https://gc.zgo.at/count.js"></script>
{% endif %}

{%- comment -%} 阅读进度条只在文章页出现 {%- endcomment -%}
{% if page.collection == "posts" %}
<div id="reading-progress" aria-hidden="true"></div>
{% endif %}

<button id="back-to-top" type="button" aria-label="Back to top" title="返回顶部">↑</button>

<script>
(function () {
  var bar = document.getElementById('reading-progress');
  var btn = document.getElementById('back-to-top');
  var ticking = false;

  function update() {
    if (bar) {
      var h = document.documentElement;
      var max = h.scrollHeight - h.clientHeight;
      bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
    }
    if (btn) {
      btn.classList.toggle('visible', document.documentElement.scrollTop > 400);
    }
    ticking = false;
  }

  function requestUpdate() {
    if (!ticking) {
      ticking = true;
      window.requestAnimationFrame(update);
    }
  }

  window.addEventListener('scroll', requestUpdate, { passive: true });
  window.addEventListener('resize', requestUpdate, { passive: true });

  if (btn) {
    btn.addEventListener('click', function () {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  update();
})();
</script>
