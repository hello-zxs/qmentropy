{% if site.goatcounter_code and site.goatcounter_code != "" %}
<script data-goatcounter="https://{{ site.goatcounter_code }}.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
{% endif %}

{% if page.collection == "posts" or page.collection == "zh_posts" %}
<div id="reading-progress" aria-hidden="true"></div>
{% endif %}

{% assign back_label = 'Back to top' %}
{% if page.lang == 'zh' %}{% assign back_label = '返回顶部' %}{% endif %}

<button id="back-to-top" type="button" aria-label="{{ back_label }}" title="{{ back_label }}">↑</button>

<script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
<script defer src="{{ '/assets/matrix/matrix.js' | relative_url }}"></script>
