name: Build Jekyll site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --trace

      - name: Check output
        run: |
          set -e
          test -f _site/index.html
          test -f _site/404.html
          test -f _site/research/index.html
          test -f _site/publications/index.html
          test -f _site/assets/images/og.png
          echo "✅ build ok"
