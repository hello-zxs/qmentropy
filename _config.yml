# ============================================
# qmentropy.com — 站点配置
# ★ 需要你手动填写的地方都标注了 【★填写】
# ============================================

# ---------- 站点基本信息 ----------
title: "Physics Lab Notes"
name: "Zheng Xiangsheng"
description: "Physics notes on transformation optics, geodesic lenses and quantum optics — by Zheng Xiangsheng, MSc at Western University."
url: "https://qmentropy.com"         # 自定义域名（来自 CNAME）
baseurl: ""
timezone: "America/Toronto"          # 现居 London, Ontario
title_separator: "·"

# ---------- 主题设置 ----------
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "dark"         # 已切换暗色主题: air / contrast / dark / mint / neon / plum / sunrise
locale: "zh-CN"
search: true
words_per_minute: 200
future: true                          # 允许"未来日期"的文章立即发布（否则构建时会被跳过）
repository: "hello-zxs/qmentropy"    # 仓库地址（giscus 评论需要）

# ---------- 学术功能 (MathJax + 分页 + Mermaid) ----------
# MathJax / Mermaid 不再全站加载：由 _includes/head/custom.html 按页面
# 的 mathjax / mermaid 开关按需注入（见 defaults），首页与归档页因此
# 少加载约 4 MB 脚本。
paginate: 5
paginate_path: /page:num/

# ---------- 评论系统 (giscus) ----------
# 【★启用评论前必做】见 README「启用评论」章节:
#   1. GitHub 仓库 -> Settings -> 勾选 Discussions
#   2. 安装 giscus app: https://github.com/apps/giscus
#   3. 打开 https://giscus.app 配置后填入下面的 repo_id / category_id
comments:
  provider: "giscus"
  giscus:
    repo_id: ""             # 【★填写】giscus.app 生成的 repo_id
    category_name: "Announcements"  # 可用 Discussions 分类名
    category_id: ""         # 【★填写】giscus.app 生成的 category_id
    description: "Comments for qmentropy.com"
    # language: "zh-CN"     # 取消注释启用中文界面

# ---------- 访问统计 (GoatCounter) ----------
# 【★启用统计必做】免费注册: https://www.goatcounter.com/signup
# 注册后获得站点代码，填入下方 YOURCODE
goatcounter_code: ""        # 【★填写】形如 "qmentropy"，留空则统计不加载

# ---------- 默认布局 ----------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: true
      toc: true
      mathjax: true          # 文章默认渲染公式
      mermaid: false         # 需要时在文章 front matter 里打开
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      mathjax: false
      mermaid: false

# ---------- 集合 ----------
collections:
  posts:
    output: true

# ---------- 排除文件（不发布到站点） ----------
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - tools/
  - package.json
  - package-lock.json

# ---------- 插件 ----------
plugins:
  - jekyll-remote-theme
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-feed

# ---------- 侧边栏 (个人资料) ----------
author:
  name: "Zheng Xiangsheng"
  avatar: "/assets/images/avatar.svg"
  bio: "Physics BSc @ XMUM → MSc @ Western University<br>Transformation optics · Geodesic lenses · Quantum optics"
  location: "London, Ontario, Canada"
  links:
    - label: "Email: helloworld.3a@gmail.com"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:helloworld.3a@gmail.com"
    - label: "GitHub: hello-zxs"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/hello-zxs"
    - label: "CV"
      icon: "fas fa-fw fa-file-alt"
      url: "/cv/"

# ---------- 页脚 ----------
# 主题会自动追加 Atom Feed，这里只放 GitHub 与归档入口，避免重复。
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/hello-zxs"
    - label: "Archive"
      icon: "fas fa-fw fa-calendar-alt"
      url: "/year-archive/"

# ---------- SEO ----------
twitter:
  username:
  card: summary_large_image
facebook:
  username:
og_image: /assets/images/og.png

# ---------- 归档页面 ----------
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
