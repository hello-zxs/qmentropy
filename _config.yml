# ============================================
# qmentropy.com — 站点配置
# 自定义 Jekyll 站点，不依赖第三方主题
# ============================================

# ---------- 站点基本信息 ----------
title: "Physics Lab Notes"
name: "Zheng Xiangsheng"
description: "Physics notes on transformation optics, geodesic lenses and quantum optics — by Zheng Xiangsheng, MSc at Western University."
url: "https://qmentropy.com"
baseurl: ""
timezone: "America/Toronto"
title_separator: "·"
locale: "en"                    # 默认英文；中文页面在 front matter 写 locale: zh-CN
future: true
repository: "hello-zxs/qmentropy"

# ---------- 访问统计（可选） ----------
# https://www.goatcounter.com/signup → 填入站点代码；留空则不加载
goatcounter_code: ""

# ---------- 默认布局 ----------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      mathjax: true
      mermaid: false
  - scope:
      path: ""
      type: pages
    values:
      layout: page
      toc: false
      mathjax: false
      mermaid: false
  - scope:
      path: ""
      type: zh_posts
    values:
      layout: post
      toc: true
      mathjax: true
      mermaid: false

# ---------- 集合 ----------
collections:
  posts:
    output: true
  zh_posts:
    output: true

# ---------- 不发布到站点的文件 ----------
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - EDITING.md
  - tools/
  - package.json
  - package-lock.json

# ---------- 插件 ----------
plugins:
  - jekyll-feed
  - jekyll-sitemap

# ---------- SEO ----------
og_image: /assets/images/og.png
