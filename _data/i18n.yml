# 双语页面的对应关系：ref -> { en: 路径, zh: 路径 }
# 页面在 front matter 里写 ref: <key>，语言切换器据此找到另一语言版本。
refs:
  home:
    en: "/"
    zh: "/zh/"
  research:
    en: "/research/"
    zh: "/zh/research/"
  publications:
    en: "/publications/"
    zh: "/zh/publications/"
  cv:
    en: "/cv/"
    zh: "/zh/cv/"
  about:
    en: "/about/"
    zh: "/zh/about/"
