  title: "Sixty years of transformation optics: From Dolin’s conjecture to experimental cloaks"
  authors: "X. Zheng"
  venue: "Manuscript"
  abstract: "A review of the transformation-optics programme, from Dolin’s 1961 conjecture and the metamaterial turn of 2000 to the coordinate-transformation and conformal-mapping cloaks of 2006 and their experimental realization. The review separates the mathematical invariance of Maxwell’s equations from the material question of whether the required constitutive parameters can be built."
